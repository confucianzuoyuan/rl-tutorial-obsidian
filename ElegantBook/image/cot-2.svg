             x="104.65166"
             y="94.64695"
             id="tspan5">公式：</tspan><tspan
             sodipodi:role="line"
             style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:3.52778px;font-family:sans-serif;-inkscape-font-specification:'sans-serif, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;fill:#000000;stroke-width:0.264583"
             x="104.65166"
             y="99.056679"
             id="tspan6">距离 = 速度$\times$时间</tspan><tspan
             sodipodi:role="line"
             style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:3.52778px;font-family:sans-serif;-inkscape-font-specification:'sans-serif, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;fill:#000000;stroke-width:0.264583"
             x="104.65166"
             y="103.4664"
             id="tspan7">其中，速度为每小时60英里，时</tspan><tspan
             sodipodi:role="line"
             style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:3.52778px;font-family:sans-serif;-inkscape-font-specification:'sans-serif, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;fill:#000000;stroke-width:0.264583"
             x="104.65166"
             y="107.87613"
             id="tspan8">间为3小时：</tspan><tspan
             sodipodi:role="line"
             style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:3.52778px;font-family:sans-serif;-inkscape-font-specification:'sans-serif, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;fill:#000000;stroke-width:0.264583"
             x="104.65166"
             y="112.28585"
             id="tspan9">距离 = 60英里/时$\times$3小时=180</tspan><tspan
             sodipodi:role="line"
             style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:3.52778px;font-family:sans-serif;-inkscape-font-specification:'sans-serif, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;fill:#000000;stroke-width:0.264583"
             x="104.65166"
             y="116.69558"
             id="tspan10">英里</tspan><tspan
             sodipodi:role="line"
             style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:3.52778px;font-family:sans-serif;-inkscape-font-specification:'sans-serif, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;fill:#000000;stroke-width:0.264583"
             x="104.65166"
             y="121.1053"
             id="tspan11">因此，火车行驶了180英里。</tspan></text>
